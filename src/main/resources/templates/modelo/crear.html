<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Formulario Modelo')}"></head>
<body>
<div class="app-wrapper">
    <aside th:replace="~{fragments/layout :: sidebar('modelos')}"></aside>
    <div class="main-content">
        <header th:replace="~{fragments/layout :: topbar('Formulario de Modelo')}"></header>

        <main class="p-4">
            <div class="row justify-content-center">
                <div class="col-lg-6">
                    <div class="card-surface p-4">
                        <form th:action="@{/modelos/guardar}" th:object="${modelo}" method="post">
                            <input type="hidden" th:field="*{idModelo}">

                            <div class="mb-3">
                                <label class="form-label fw-semibold">Marca *</label>
                                <input type="text" class="form-control" th:field="*{marcaModelo}" required maxlength="30" placeholder="Ej: Toyota, Chevrolet, Renault">
                            </div>

                            <div class="mb-4">
                                <label class="form-label fw-semibold">Nombre del Modelo *</label>
                                <input type="text" class="form-control" th:field="*{nombreModelo}" required maxlength="30" placeholder="Ej: Corolla, Spark GT, Logan">
                            </div>

                            <div class="d-flex justify-content-end gap-2">
                                <a th:href="@{/modelos/listar}" class="btn btn-secondary">Cancelar</a>
                                <button type="submit" class="btn btn-primary">
                                    <i class="bi bi-check-lg me-1"></i>Guardar Modelo
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>
<div th:replace="~{fragments/layout :: feedback}"></div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
