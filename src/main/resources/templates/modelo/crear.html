<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Registrar Modelo</title>
</head>
<body>
<h1>Registrar Nuevo Modelo</h1>

<div th:if="${error}" style="color: red; margin-bottom: 15px;">
    <p th:text="${error}"></p>
</div>

<form th:action="@{/modelos/guardar}" th:object="${modelo}" method="post">

    <div>
        <label>Nombre del Modelo:</label>
        <input type="text" th:field="*{nombreModelo}" required maxlength="30">
    </div>
    <br>

    <div>
        <label>Marca:</label>
        <input type="text" th:field="*{marcaModelo}" required maxlength="30">
    </div>
    <br>

    <button type="submit">Guardar Modelo</button>
    <a th:href="@{/modelos/listar}">Cancelar</a>
</form>
</body>
</html>
