<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Detalle de Reparación')}"></head>
<body>
<div class="app-wrapper">
    <aside th:replace="~{fragments/layout :: sidebar('reparaciones')}"></aside>
    <div class="main-content">
        <header th:replace="~{fragments/layout :: topbar('Detalle de Reparación')}"></header>

        <main class="p-4">
            <div class="row justify-content-center">
                <div class="col-lg-7">
                    <div class="card-surface p-4">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <span class="badge bg-dark fs-5" th:text="${reparacion.idVehiculo.placaVehiculo}"></span>
                            <span th:if="${reparacion.estadoReparacion.name() == 'EN_PROCESO'}" class="badge bg-warning text-dark fs-6">En Proceso</span>
                            <span th:if="${reparacion.estadoReparacion.name() == 'TERMINADO'}" class="badge bg-success fs-6">Terminado</span>
                            <span th:if="${reparacion.estadoReparacion.name() == 'CANCELADO'}" class="badge bg-danger fs-6">Cancelado</span>
                        </div>
                        <hr>
                        <div class="row g-3 mb-4">
                            <div class="col-sm-6">
                                <span class="text-muted small d-block">Fecha de Ingreso</span>
                                <strong th:text="${#temporals.format(reparacion.fechaReparacion, 'dd/MM/yyyy HH:mm')}"></strong>
                            </div>
                            <div class="col-sm-6">
                                <span class="text-muted small d-block">Tipo de Servicio</span>
                                <strong th:text="${#strings.replace(reparacion.tipoReparacion.name(), '_', ' ')}"></strong>
                            </div>
                            <div class="col-sm-6">
                                <span class="text-muted small d-block">Vehículo</span>
                                <span th:text="${reparacion.idVehiculo.idModelo.marcaModelo + ' ' + reparacion.idVehiculo.idModelo.nombreModelo}"></span>
                            </div>
                            <div class="col-sm-6">
                                <span class="text-muted small d-block">Mecánico Asignado</span>
                                <span th:text="${reparacion.idUsuario.nombreUsuario}"></span>
                            </div>
                            <div class="col-12">
                                <span class="text-muted small d-block">Observaciones</span>
                                <p class="mb-0" th:text="${reparacion.observacion != null and !reparacion.observacion.isBlank() ? reparacion.observacion : 'Sin observaciones registradas.'}"></p>
                            </div>
                        </div>
                        <div class="d-flex justify-content-end gap-2">
                            <a th:href="@{/reparaciones/listar}" class="btn btn-secondary">Volver</a>
                            <a th:if="${reparacion.estadoReparacion.name() == 'EN_PROCESO'}"
                               th:href="@{/reparaciones/editar/{id}(id=${reparacion.idReparacion})}" class="btn btn-primary">Editar</a>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>
<div th:replace="~{fragments/layout :: feedback}"></div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
