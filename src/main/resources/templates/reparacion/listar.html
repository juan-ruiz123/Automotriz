<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Reparaciones')}"></head>
<body>
<div class="app-wrapper">
    <aside th:replace="~{fragments/layout :: sidebar('reparaciones')}"></aside>
    <div class="main-content">
        <header th:replace="~{fragments/layout :: topbar('Órdenes de Reparación')}"></header>

        <main class="p-4">
            <div class="card-surface p-4">
                <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
                    <div class="input-group" style="max-width: 340px;">
                        <span class="input-group-text"><i class="bi bi-search"></i></span>
                        <input id="tableSearchInput" type="text" class="form-control" placeholder="Filtrar por placa, mecánico o estado...">
                    </div>
                    <a th:href="@{/reparaciones/crear}" class="btn btn-primary">
                        <i class="bi bi-plus-lg me-1"></i>Nueva Reparación
                    </a>
                </div>

                <div class="table-responsive">
                    <table id="dataTable" class="table table-hover align-middle">
                        <thead>
                        <tr>
                            <th>#</th>
                            <th>Fecha</th>
                            <th>Vehículo</th>
                            <th>Tipo</th>
                            <th>Mecánico</th>
                            <th>Estado</th>
                            <th class="text-end">Acciones</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="rep : ${reparaciones}" data-searchable="true">
                            <td th:text="${rep.idReparacion}"></td>
                            <td class="small" th:text="${#temporals.format(rep.fechaReparacion, 'dd/MM/yyyy HH:mm')}"></td>
                            <td><span class="badge bg-dark" th:text="${rep.idVehiculo.placaVehiculo}"></span></td>
                            <td class="small" th:text="${#strings.replace(rep.tipoReparacion.name(), '_', ' ')}"></td>
                            <td th:text="${rep.idUsuario.nombreUsuario}"></td>
                            <td>
                                <span th:if="${rep.estadoReparacion.name() == 'EN_PROCESO'}" class="badge bg-warning text-dark">En Proceso</span>
                                <span th:if="${rep.estadoReparacion.name() == 'TERMINADO'}" class="badge bg-success">Terminado</span>
                                <span th:if="${rep.estadoReparacion.name() == 'CANCELADO'}" class="badge bg-danger">Cancelado</span>
                            </td>
                            <td class="text-end">
                                <div class="d-inline-flex gap-1">
                                    <a th:href="@{/reparaciones/detalle/{id}(id=${rep.idReparacion})}" class="btn btn-sm btn-outline-secondary" title="Detalle">
                                        <i class="bi bi-eye"></i>
                                    </a>
                                    <a th:if="${rep.estadoReparacion.name() == 'EN_PROCESO'}"
                                       th:href="@{/reparaciones/editar/{id}(id=${rep.idReparacion})}" class="btn btn-sm btn-outline-primary" title="Editar">
                                        <i class="bi bi-pencil"></i>
                                    </a>
                                    <!-- Finalizar reparación -> dispara notificación por correo -->
                                    <form th:if="${rep.estadoReparacion.name() == 'EN_PROCESO'}"
                                          th:action="@{/reparaciones/estado/{id}(id=${rep.idReparacion})}" method="post" class="d-inline">
                                        <input type="hidden" name="nuevoEstado" value="TERMINADO">
                                        <button type="submit" class="btn btn-sm btn-success" title="Marcar como Terminado y notificar al cliente">
                                            <i class="bi bi-check2-circle"></i> Terminar
                                        </button>
                                    </form>
                                    <!-- Cancelar (solo Administrador) -->
                                    <a th:if="${esAdmin and rep.estadoReparacion.name() == 'EN_PROCESO'}" href="#"
                                       th:data-confirm-url="@{/reparaciones/cancelar/{id}(id=${rep.idReparacion})}"
                                       data-confirm-text="¿Seguro que desea cancelar esta orden de reparación? Esta acción es irreversible."
                                       class="btn btn-sm btn-outline-danger" title="Cancelar reparación">
                                        <i class="bi bi-x-lg"></i>
                                    </a>
                                </div>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(reparaciones)}">
                            <td colspan="7" class="text-center text-muted py-4">No hay reparaciones registradas.</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
</div>
<div th:replace="~{fragments/layout :: feedback}"></div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
