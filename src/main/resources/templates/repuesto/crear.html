<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Formulario Repuesto')}"></head>
<body>
<div class="app-wrapper">
    <aside th:replace="~{fragments/layout :: sidebar('repuestos')}"></aside>
    <div class="main-content">
        <header th:replace="~{fragments/layout :: topbar('Inventario de Repuestos')}"></header>

        <main class="p-4">
            <div class="row justify-content-center">
                <div class="col-lg-8">
                    <div class="card-surface p-4">
                        <h5 class="fw-bold mb-4" th:text="${repuesto.idRepuesto != null ? 'Editar Repuesto' : 'Registrar Nuevo Repuesto'}"></h5>

                        <form th:action="@{/repuestos/guardar}" th:object="${repuesto}" method="post">
                            <input type="hidden" th:field="*{idRepuesto}">

                            <div class="row g-3 mb-3">
                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">Nombre del Repuesto *</label>
                                    <input type="text" class="form-control" th:field="*{nombreRepuesto}" required maxlength="50">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">Código de Barras EAN (13 dígitos) *</label>
                                    <input type="text" class="form-control" th:field="*{eanRepuesto}" required maxlength="13" placeholder="7701234567890">
                                </div>
                                <div class="col-12">
                                    <label class="form-label fw-semibold">Descripción *</label>
                                    <textarea class="form-control" th:field="*{descripcionRepuesto}" rows="2" required></textarea>
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label fw-semibold">Precio (COP) *</label>
                                    <input type="number" step="0.01" min="1" class="form-control" th:field="*{precioRepuesto}" required>
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label fw-semibold">Stock Disponible *</label>
                                    <input type="number" min="0" class="form-control" th:field="*{stockRepuesto}" required>
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label fw-semibold">URL Imagen Referencia</label>
                                    <input type="text" class="form-control" th:field="*{fotoRepuesto}" maxlength="200" placeholder="https://...">
                                </div>
                            </div>

                            <div class="mb-4">
                                <label class="form-label fw-semibold">Modelos Compatibles (Seleccione al menos uno) *</label>
                                <div class="border rounded p-3" style="max-height: 200px; overflow-y: auto;">
                                    <div class="row g-2">
                                        <div class="col-md-6" th:each="m : ${listaModelos}" th:if="${m.activoModelo}">
                                            <div class="form-check">
                                                <input class="form-check-input" type="checkbox" name="modelosIds"
                                                       th:value="${m.idModelo}" th:id="${'mod_' + m.idModelo}"
                                                       th:checked="${modelosSeleccionados != null and #lists.contains(modelosSeleccionados, m.idModelo)}">
                                                <label class="form-check-label" th:for="${'mod_' + m.idModelo}"
                                                       th:text="${m.marcaModelo + ' - ' + m.nombreModelo}"></label>
                                            </div>
                                        </div>
                                    </div>
                                    <p th:if="${#lists.isEmpty(listaModelos)}" class="text-muted small mb-0">No hay modelos registrados. Cree un modelo primero.</p>
                                </div>
                            </div>

                            <div class="d-flex justify-content-end gap-2">
                                <a th:href="@{/repuestos/listar}" class="btn btn-secondary">Cancelar</a>
                                <button type="submit" class="btn btn-primary">
                                    <i class="bi bi-check-lg me-1"></i>Guardar Repuesto
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>
<div th:replace="~{fragments/layout :: feedback}"></div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
