<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Detalle del Repuesto')}"></head>
<body>
<div class="app-wrapper">
    <aside th:replace="~{fragments/layout :: sidebar('repuestos')}"></aside>
    <div class="main-content">
        <header th:replace="~{fragments/layout :: topbar('Ficha del Repuesto')}"></header>

        <main class="p-4">
            <div class="row justify-content-center">
                <div class="col-lg-7">
                    <div class="card-surface p-4">
                        <div class="d-flex align-items-center gap-3 mb-3">
                            <img th:src="${repuesto.fotoRepuesto}" alt="Foto" class="rounded border" style="width: 72px; height: 72px; object-fit: cover;">
                            <div>
                                <h4 class="fw-bold mb-1" th:text="${repuesto.nombreRepuesto}"></h4>
                                <code>EAN: <span th:text="${repuesto.eanRepuesto}"></span></code>
                            </div>
                        </div>
                        <hr>
                        <p class="mb-3" th:text="${repuesto.descripcionRepuesto}"></p>
                        <div class="row g-3 mb-4">
                            <div class="col-4">
                                <span class="text-muted small d-block">Precio</span>
                                <strong th:text="${'$ ' + #numbers.formatDecimal(repuesto.precioRepuesto, 1, 'POINT', 0, 'COMMA')}"></strong>
                            </div>
                            <div class="col-4">
                                <span class="text-muted small d-block">Stock</span>
                                <strong th:text="${repuesto.stockRepuesto + ' unidades'}"></strong>
                            </div>
                            <div class="col-4">
                                <span class="text-muted small d-block">Estado</span>
                                <span th:if="${repuesto.activoRepuesto}" class="badge bg-success">Activo</span>
                                <span th:unless="${repuesto.activoRepuesto}" class="badge bg-danger">Inactivo</span>
                            </div>
                        </div>

                        <h6 class="fw-bold mb-2">Modelos Compatibles</h6>
                        <div class="d-flex flex-wrap gap-2 mb-4">
                            <span class="badge bg-primary-subtle text-primary border border-primary-subtle"
                                  th:each="m : ${modelosCompatibles}"
                                  th:text="${m.marcaModelo + ' ' + m.nombreModelo}"></span>
                        </div>

                        <div class="d-flex justify-content-end gap-2">
                            <a th:href="@{/repuestos/listar}" class="btn btn-secondary">Volver</a>
                            <a th:if="${esAdmin}" th:href="@{/repuestos/editar/{id}(id=${repuesto.idRepuesto})}" class="btn btn-primary">Editar</a>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>
<div th:replace="~{fragments/layout :: feedback}"></div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
