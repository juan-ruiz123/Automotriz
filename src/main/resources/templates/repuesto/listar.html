<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Repuestos')}"></head>
<body>
<div class="app-wrapper">
    <aside th:replace="~{fragments/layout :: sidebar('repuestos')}"></aside>
    <div class="main-content">
        <header th:replace="~{fragments/layout :: topbar('Inventario de Repuestos')}"></header>

        <main class="p-4">
            <div class="card-surface p-4">
                <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
                    <div class="input-group" style="max-width: 340px;">
                        <span class="input-group-text"><i class="bi bi-search"></i></span>
                        <input id="tableSearchInput" type="text" class="form-control" placeholder="Filtrar por nombre o EAN...">
                    </div>
                    <a th:if="${esAdmin}" th:href="@{/repuestos/crear}" class="btn btn-primary">
                        <i class="bi bi-plus-lg me-1"></i>Nuevo Repuesto
                    </a>
                </div>

                <div class="table-responsive">
                    <table id="dataTable" class="table table-hover align-middle">
                        <thead>
                        <tr>
                            <th>Imagen</th>
                            <th>EAN-13</th>
                            <th>Nombre</th>
                            <th>Precio (COP)</th>
                            <th>Stock</th>
                            <th>Estado</th>
                            <th class="text-end">Acciones</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="r : ${repuestos}" data-searchable="true">
                            <td>
                                <img th:src="${r.fotoRepuesto}" alt="Repuesto" class="rounded border" style="width: 42px; height: 42px; object-fit: cover;">
                            </td>
                            <td><code th:text="${r.eanRepuesto}"></code></td>
                            <td class="fw-semibold" th:text="${r.nombreRepuesto}"></td>
                            <td th:text="${'$ ' + #numbers.formatDecimal(r.precioRepuesto, 1, 'POINT', 0, 'COMMA')}"></td>
                            <td>
                                    <span class="badge" th:classappend="${r.stockRepuesto > 5 ? 'bg-info text-dark' : 'bg-warning text-dark'}"
                                          th:text="${r.stockRepuesto + ' und'}"></span>
                            </td>
                            <td>
                                <span th:if="${r.activoRepuesto}" class="badge bg-success">Activo</span>
                                <span th:unless="${r.activoRepuesto}" class="badge bg-danger">Inactivo</span>
                            </td>
                            <td class="text-end">
                                <a th:href="@{/repuestos/detalle/{id}(id=${r.idRepuesto})}" class="btn btn-sm btn-outline-secondary" title="Detalle">
                                    <i class="bi bi-eye"></i>
                                </a>
                                <a th:if="${esAdmin}" th:href="@{/repuestos/editar/{id}(id=${r.idRepuesto})}" class="btn btn-sm btn-outline-primary" title="Editar">
                                    <i class="bi bi-pencil"></i>
                                </a>
                                <a th:if="${esAdmin and r.activoRepuesto}" href="#"
                                   th:data-confirm-url="@{/repuestos/eliminar/{id}(id=${r.idRepuesto})}"
                                   data-confirm-text="¿Seguro que desea dar de baja este repuesto?"
                                   class="btn btn-sm btn-outline-danger" title="Dar de baja">
                                    <i class="bi bi-trash"></i>
                                </a>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(repuestos)}">
                            <td colspan="7" class="text-center text-muted py-4">No hay repuestos registrados.</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
</div>
<div th:replace="~{fragments/layout :: feedback}"></div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
