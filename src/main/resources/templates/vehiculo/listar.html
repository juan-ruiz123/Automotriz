<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Vehículos')}"></head>
<body>
<div class="app-wrapper">
    <aside th:replace="~{fragments/layout :: sidebar('vehiculos')}"></aside>
    <div class="main-content">
        <header th:replace="~{fragments/layout :: topbar('Gestión de Vehículos')}"></header>

        <main class="p-4">
            <div class="card-surface p-4">
                <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
                    <div class="input-group" style="max-width: 340px;">
                        <span class="input-group-text"><i class="bi bi-search"></i></span>
                        <input id="tableSearchInput" type="text" class="form-control" placeholder="Filtrar por placa, dueño o modelo...">
                    </div>
                    <a th:if="${esAdmin}" th:href="@{/vehiculos/crear}" class="btn btn-primary">
                        <i class="bi bi-plus-lg me-1"></i>Nuevo Vehículo
                    </a>
                </div>

                <div class="table-responsive">
                    <table id="dataTable" class="table table-hover align-middle">
                        <thead>
                        <tr>
                            <th>Placa</th>
                            <th>Tipo Placa</th>
                            <th>Modelo</th>
                            <th>Propietario</th>
                            <th>Correo</th>
                            <th>Estado</th>
                            <th class="text-end">Acciones</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="v : ${vehiculos}" data-searchable="true">
                            <td><span class="badge bg-dark fs-6" th:text="${v.placaVehiculo}"></span></td>
                            <td>
                                    <span class="badge"
                                          th:classappend="${v.tipoPlaca.name() == 'AMARILLA' ? 'bg-warning text-dark' : 'bg-light text-dark border'}"
                                          th:text="${v.tipoPlaca}"></span>
                            </td>
                            <td th:text="${v.idModelo.marcaModelo + ' ' + v.idModelo.nombreModelo}"></td>
                            <td th:text="${v.nombreDuenoVehi}"></td>
                            <td class="small" th:text="${v.correoDueno}"></td>
                            <td>
                                <span th:if="${v.activoVehiculo}" class="badge bg-success">Activo</span>
                                <span th:unless="${v.activoVehiculo}" class="badge bg-danger">Inactivo</span>
                            </td>
                            <td class="text-end">
                                <a th:href="@{/vehiculos/detalle/{id}(id=${v.idVehiculo})}" class="btn btn-sm btn-outline-secondary" title="Detalle">
                                    <i class="bi bi-eye"></i>
                                </a>
                                <a th:if="${esAdmin}" th:href="@{/vehiculos/editar/{id}(id=${v.idVehiculo})}" class="btn btn-sm btn-outline-primary" title="Editar">
                                    <i class="bi bi-pencil"></i>
                                </a>
                                <a th:if="${esAdmin and v.activoVehiculo}" href="#"
                                   th:data-confirm-url="@{/vehiculos/eliminar/{id}(id=${v.idVehiculo})}"
                                   data-confirm-text="¿Seguro que desea dar de baja este vehículo?"
                                   class="btn btn-sm btn-outline-danger" title="Dar de baja">
                                    <i class="bi bi-trash"></i>
                                </a>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(vehiculos)}">
                            <td colspan="7" class="text-center text-muted py-4">No hay vehículos registrados.</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
</div>
<div th:replace="~{fragments/layout :: feedback}"></div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
