<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Formulario Usuario')}"></head>
<body>
<div class="app-wrapper">
    <aside th:replace="~{fragments/layout :: sidebar('usuarios')}"></aside>
    <div class="main-content">
        <header th:replace="~{fragments/layout :: topbar('Formulario de Usuario')}"></header>

        <main class="p-4">
            <div class="row justify-content-center">
                <div class="col-lg-6">
                    <div class="card-surface p-4">
                        <form th:action="@{/usuarios/guardar}" th:object="${usuario}" method="post">
                            <input type="hidden" th:field="*{idUsuario}">

                            <div class="mb-3">
                                <label class="form-label fw-semibold">Nombre Completo *</label>
                                <input type="text" class="form-control" th:field="*{nombreUsuario}" required maxlength="100">
                            </div>

                            <div class="row g-3 mb-3">
                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">Nombre de Usuario *</label>
                                    <input type="text" class="form-control" th:field="*{userNameUsuario}" required maxlength="50">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">Rol del Sistema *</label>
                                    <select class="form-select" th:field="*{rol}" required>
                                        <option value="">Seleccione...</option>
                                        <option th:each="r : ${roles}" th:value="${r}" th:text="${r}"></option>
                                    </select>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-semibold">Correo Electrónico *</label>
                                <input type="email" class="form-control" th:field="*{correoUsuario}" required maxlength="100">
                            </div>

                            <div class="mb-4">
                                <label class="form-label fw-semibold">Contraseña <span th:if="${usuario.idUsuario == null}">*</span></label>
                                <input type="password" class="form-control" th:field="*{passwordUsuario}"
                                       th:required="${usuario.idUsuario == null}"
                                       placeholder="Dejar en blanco para mantener la actual al editar">
                            </div>

                            <div class="d-flex justify-content-end gap-2">
                                <a th:href="@{/usuarios/listar}" class="btn btn-secondary">Cancelar</a>
                                <button type="submit" class="btn btn-primary">
                                    <i class="bi bi-check-lg me-1"></i>Guardar Usuario
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>
<div th:replace="~{fragments/layout :: feedback}"></div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
