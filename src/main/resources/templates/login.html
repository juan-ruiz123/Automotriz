<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión | AutoTaller Pro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background: #ffffff;
            border-radius: 1.25rem;
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.35);
            overflow: hidden;
            max-width: 420px;
            width: 100%;
        }
        .login-header {
            background: #2563eb;
            color: #ffffff;
            padding: 2rem 1.5rem;
            text-align: center;
        }
    </style>
</head>
<body>
<div class="login-card mx-3">
    <div class="login-header">
        <i class="bi bi-wrench-adjustable-circle-fill display-4"></i>
        <h4 class="fw-bold mt-2 mb-0">AutoTaller Pro</h4>
        <p class="small text-white-50 mb-0">Sistema de Gestión Automotriz</p>
    </div>

    <div class="p-4">
        <div th:if="${param.error}" class="alert alert-danger d-flex align-items-center small" role="alert">
            <i class="bi bi-exclamation-circle-fill me-2 fs-5"></i>
            <div>Credenciales incorrectas o usuario inactivo. Verifique sus datos e intente nuevamente.</div>
        </div>

        <div th:if="${param.logout}" class="alert alert-success d-flex align-items-center small" role="alert">
            <i class="bi bi-check-circle-fill me-2 fs-5"></i>
            <div>Has cerrado sesión de forma segura.</div>
        </div>

        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label class="form-label fw-semibold">Usuario</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-person-fill"></i></span>
                    <input type="text" name="username" class="form-control" placeholder="Ingrese su usuario" required autofocus>
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label fw-semibold">Contraseña</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
                    <input type="password" name="password" class="form-control" placeholder="••••••••" required>
                </div>
            </div>

            <div class="d-grid">
                <button type="submit" class="btn btn-primary btn-lg fw-semibold">
                    <i class="bi bi-box-arrow-in-right me-2"></i>Iniciar Sesión
                </button>
            </div>
        </form>
    </div>
</div>
</body>
</html>
